/**:
    ros__parameters:
        feature_extract_enable: false
        point_filter_num: 4
        max_iteration: 3
        filter_size_surf: 0.5
        filter_size_map: 0.5
        cube_side_length: 1000.0
        runtime_pos_log_enable: false
        map_file_path: "./test.pcd"

        common:
            lid_topic:  "/hesai/pandar"
            imu_topic:  "/alphasense_driver_ros/imu"
            time_sync_en: false         # ONLY turn on when external time synchronization is really not possible
            time_offset_lidar_to_imu: 0.0 # Time offset between lidar and IMU calibrated by other algorithms, e.g. LI-Init (can be found in README).
                                        # This param will take effect no matter what time_sync_en is. So if the time offset is not known exactly, please set as 0.0
            
        preprocess:
            lidar_type: 5                # AVIA = 1, VELO16 = 2, OUST64 = 3, MID360 = 4, XT32 = 5, L515 = 6, VELO32 = 7
            scan_line: 64
            scan_rate: 10
            timestamp_unit: 3                 # 0-second, 1-milisecond, 2-microsecond, 3-nanosecond.
            blind: 1.5

        cameras:
            frame_rate: 20
            cam_topics: ["/alphasense_driver_ros/cam0/color/image_rect", "/alphasense_driver_ros/cam1/color/image_rect", "/alphasense_driver_ros/cam2/color/image_rect"]
            cam_intrinsics : [700.0151358992393, 0.0, 712.7829085438963, 0.0, 698.788447974813, 559.9781983734637, 0.0, 0.0, 1.0,
                              697.757801163887, 0.0, 718.8702962779893, 0.0, 696.4057434481674, 539.1725883866554, 0.0, 0.0, 1.0,
                              699.1796326565628, 0.0, 715.1591529587915, 0.0, 697.8422036787862, 533.8283288384044, 0.0, 0.0, 1.0]
            T_cam_lidars: [-0.00015374290652726507, -0.07845558325130414, -0.05051542218698944,
                           0.004875137466372477, -0.07887512846833249, -0.05421207113440782,
                           -0.005178330950377591, -0.07833689411523856, -0.054848922156481815]
            R_cam_lidars: [0.004719841525355484, 0.9999824271822094, 0.003587258389425585, 0.00300756231512167, 0.003573086837588335, -0.9999890937502125, -0.99998433870981, 0.004730578952731601, -0.0029906450601474566,
                           -0.9999345603502748, 0.01074183176272035, 0.003935488215746646, -0.00396852193678023, -0.0030556600264459474, -0.9999874568090602, -0.010729671511847857, -0.9999376360514672, 0.0030980892601155316,
                           0.9999888904525023, -0.0039761918559729405, -0.002531574589658226, -0.0025270043531893356, 0.0011540040842165657, -0.9999961412543437, 0.0039790979602756646, 0.9999914290497212, 0.0011439434096243589]

        mapping:
            acc_cov: 0.001202028502700754
            gyr_cov: 0.0003655255870559997
            b_acc_cov: 5.2639003774643306e-05
            b_gyr_cov: 7.394478709479997e-06
            fov_degree:    180.0
            det_range:     150.0
            extrinsic_est_en:  false      # true: enable the online estimation of IMU-LiDAR extrinsic
            extrinsic_T: [ -0.005, -0.010, 0.044 ]
            extrinsic_R: [ -0.0169719, -0.9998519,  0.0028286,
                            0.9998560, -0.0169719,  0.0000240,
                            0.0000240,  0.0028286,  0.9999960 ]

        publish:
            path_en: true                # true: publish Path
            effect_map_en: false         # true: publish Effects
            map_en: true                 # true: publish Map cloud
            scan_publish_en:  true       # false: close all the point cloud output
            dense_publish_en: false      # false: low down the points number in a global-frame point clouds scan.
            scan_bodyframe_pub_en: false  # true: output the point cloud scans in IMU-body-frame
            pub_map_n_secs: 10            # publish rate of map cloud

        pcd_save:
            pcd_save_en: false
            interval: -1                 # how many LiDAR frames saved in each pcd file; 
                                        # -1 : all frames will be saved in ONE pcd file, may lead to memory crash when having too much frames.