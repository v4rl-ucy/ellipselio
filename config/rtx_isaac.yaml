/**:
    ros__parameters:

        mapping:
            map_resolution: 0.1
            pub_map_n_secs: 10 
            
        lidar:
            type: 6 # LIVOX = 1, VELODYNE = 2, OUSTER = 3, HESAI = 4, GAZEBO = 5, ISAAC_SIM = 6
            rate: 10
            scan_lines: 16
            vertical_fov: 30.0
            min_range: 0.0
            max_range: 100.0
            topic:  "/navrl_lidar_points"
            t_imu_lidar: [0, 0, 0]
            r_imu_lidar: [0, 0, 0, 1]

        imu:
            rate: 100
            acc_noise: 0.1
            gyr_noise: 0.1
            acc_bias: 0.0001
            gyr_bias: 0.0001
            topic:  "/navrl_imu"